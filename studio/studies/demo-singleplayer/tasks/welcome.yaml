body_md: |
  ## Welcome

  You will explore a small car dataset with **{{ params.tool_name }}**, a
  mixed-initiative ranking tool: you drag cars into your preferred order and
  adjust attribute weights; a ranking agent recomputes the order as you do.

  The study takes {{ params.study_duration }}. Please think aloud — your
  microphone and screen are being recorded.
