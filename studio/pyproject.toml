[project]
name = "mivais-studio"
version = "0.1.0"
description = "Revisit-style study platform for MIVAIS-based visual analytics systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "beanie>=1.27,<2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.17",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.27",
    "watchfiles>=0.24",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["studio*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "mongo: requires a reachable MongoDB instance (auto-skipped otherwise)",
]
filterwarnings = [
    # faster-whisper + soundfile carry deprecation warnings we don't care about.
    "ignore::DeprecationWarning",
]
